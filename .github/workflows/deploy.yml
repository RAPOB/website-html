name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update cPanel repo from GitHub
        run: |
          curl -sS --fail \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            -X POST \
            "https://${{ secrets.CPANEL_HOST }}/execute/VersionControl/update" \
            -d "repository_root=${{ secrets.CPANEL_REPO_ROOT }}&branch=main"

      - name: Deploy HEAD commit
        run: |
          curl -sS --fail \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            -X POST \
            "https://${{ secrets.CPANEL_HOST }}/execute/VersionControlDeployment/create" \
            -d "repository_root=${{ secrets.CPANEL_REPO_ROOT }}"

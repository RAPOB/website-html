deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/cp index.php $DEPLOYPATH
    - /bin/cp adventures.php $DEPLOYPATH
    - /bin/cp projects.php $DEPLOYPATH
    - /bin/cp conferences.php $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.php $DEPLOYPATH
    - /bin/cp -R images $DEPLOYPATH
    # cp never deletes, so purge files that must not be public
    - /bin/rm -f $DEPLOYPATH/README.md $DEPLOYPATH/sitemap.xml $DEPLOYPATH/router.php $DEPLOYPATH/images/reuben_linkedin_profile_images.html $DEPLOYPATH/images/IMG_3604.HEIC $DEPLOYPATH/images/Cover_photo.jpg
